<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lịch Tập Gym + Bơi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>

    :root{
      --bg:#060816;
      --card:#12182d;
      --card2:#1a223d;
      --border:rgba(255,255,255,.06);
      --text:#ffffff;
      --muted:#9ba7c7;
      --accent:#7c5cff;
      --accent2:#38bdf8;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:"Inter",sans-serif;
      background:
        radial-gradient(circle at top left, rgba(124,92,255,.2), transparent 30%),
        radial-gradient(circle at top right, rgba(56,189,248,.14), transparent 25%),
        var(--bg);

      color:var(--text);
      min-height:100vh;
      padding:28px;
    }

    .container{
      max-width:1600px;
      margin:auto;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      margin-bottom:40px;
      flex-wrap:wrap;
    }

    h1{
      font-size:clamp(36px,6vw,70px);
      line-height:.95;
      font-weight:900;
      letter-spacing:-3px;
    }

    .mode-switch{
      display:flex;
      align-items:center;
      gap:14px;
      background:rgba(255,255,255,.05);
      border:1px solid var(--border);
      padding:10px;
      border-radius:999px;
      backdrop-filter:blur(20px);
    }

    .mode-btn{
      border:none;
      background:transparent;
      color:var(--muted);
      padding:14px 24px;
      border-radius:999px;
      cursor:pointer;
      font-size:15px;
      font-weight:700;
      transition:.25s;
    }

    .mode-btn.active{
      background:linear-gradient(135deg,var(--accent),#9b8cff);
      color:white;
      box-shadow:0 10px 30px rgba(124,92,255,.35);
    }

    .schedule{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
      gap:24px;
    }

    .day-card{
      background:rgba(18,24,45,.78);
      border:1px solid var(--border);
      border-radius:28px;
      overflow:hidden;
      backdrop-filter:blur(16px);
      box-shadow:0 18px 50px rgba(0,0,0,.35);
    }

    .day-header{
      padding:24px;
      border-bottom:1px solid rgba(255,255,255,.05);
      background:linear-gradient(180deg, rgba(255,255,255,.03), transparent);
    }

    .day-header h2{
      font-size:28px;
      margin-bottom:8px;
      font-weight:900;
    }

    .day-header p{
      color:var(--muted);
      line-height:1.6;
      font-size:15px;
    }

    .exercise-list{
      padding:18px;
      display:grid;
      gap:18px;
    }

    .exercise{
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.05);
      border-radius:24px;
      overflow:hidden;
      transition:.25s;
    }

    .exercise:hover{
      transform:translateY(-4px);
      border-color:rgba(124,92,255,.3);
    }

    .gif-wrap{
      position:relative;
      background:#0a1022;
    }

    .exercise img{
      width:100%;
      height:250px;
      object-fit:contain;
      display:block;
      padding:14px;
    }

    .gif-badge{
      position:absolute;
      top:14px;
      right:14px;
      z-index:5;

      padding:8px 14px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      letter-spacing:.3px;

      backdrop-filter:blur(10px);
    }

    .badge-sim{
      background:rgba(124,92,255,.18);
      color:#d9d2ff;
      border:1px solid rgba(124,92,255,.3);
    }

    .badge-real{
      background:rgba(56,189,248,.18);
      color:#d4f4ff;
      border:1px solid rgba(56,189,248,.3);
    }

    .exercise-content{
      padding:18px;
    }

    .exercise-name{
      font-size:19px;
      font-weight:800;
      margin-bottom:8px;
    }

    .sets{
      color:#cbd5e1;
      font-size:15px;
      font-weight:600;
    }

    .recovery{
      margin:18px;
      padding:20px;
      text-align:center;
      border-radius:20px;
      background:linear-gradient(
        135deg,
        rgba(56,189,248,.08),
        rgba(124,92,255,.08)
      );
      border:1px solid rgba(255,255,255,.06);
      font-size:18px;
      font-weight:700;
      color:#eef2ff;
    }

    @media(max-width:768px){

      body{
        padding:18px;
      }

      .topbar{
        align-items:flex-start;
      }

      .schedule{
        grid-template-columns:1fr;
      }

      .exercise img{
        height:220px;
      }

      .day-header h2{
        font-size:24px;
      }

    }

  </style>
</head>

<body>

<div class="container">

  <div class="topbar">

    <div>
      <h1>
        Gym Schedule
      </h1>
    </div>

    <div class="mode-switch">

      <button class="mode-btn active" id="simBtn">
        Simulator GIF
      </button>

      <button class="mode-btn" id="realBtn">
        Real Human GIF
      </button>

    </div>

  </div>

  <div class="schedule" id="schedule"></div>

</div>

<script>

const exercises = {

  "Thứ 2": {
    subtitle:"Push • Ngực + Vai + Tay sau",
    items:[
      ["Incline_Dumbbell_Press","Incline Press","4 x 8-10"],
      ["Chest_Press_Machine","Chest Press","3 x 10"],
      ["Dumbbell_Shoulder_Press","Shoulder Press","4 x 8-10"],
      ["Dumbbell_Lateral_Raise","Lateral Raise","3 x 12-15"],
      ["Triceps_Pushdown","Tricep Pushdown","3 x 12"],
      ["High_Pulley_Overhead_Tricep_Extension","Overhead Tricep Extension","3 x 12"]
    ]
  },

  "Thứ 3": {
    subtitle:"Pull • Lưng + Tay trước",
    items:[
      ["Lat_Pulldown","Lat Pulldown","4 x 10"],
      ["Seated_Row_Machine","Seated Row","4 x 10"],
      ["Dumbbell_Row","Dumbbell Row","3 x 10"],
      ["Face_Pull","Face Pull","3 x 15"],
      ["Barbell_Curl","Barbell Curl","3 x 12"],
      ["Hammer_Curl","Hammer Curl","3 x 12"]
    ],
    recovery:"🏊 Bơi nhẹ — 60 phút"
  },

  "Thứ 4": {
    subtitle:"Leg Day + Abs",
    items:[
      ["Hack_Squat","Hack Squat","4 x 8"],
      ["Leg_Press","Leg Press","4 x 10"],
      ["Romanian_Deadlift","Romanian Deadlift","3 x 10"],
      ["Leg_Curl","Leg Curl","3 x 12"],
      ["Standing_Calf_Raise","Calf Raise","4 x 15"],
      ["Hanging_Leg_Raise","Hanging Leg Raise","3 x 15"],
      ["Cable_Crunch","Cable Crunch","3 x 15"]
    ]
  },

  "Thứ 5": {
    subtitle:"Recovery",
    recovery:"🏊 Bơi pace vừa — 60 phút"
  },

  "Thứ 6": {
    subtitle:"Shoulders + Arms",
    items:[
      ["Dumbbell_Shoulder_Press","DB Shoulder Press","4 x 10"],
      ["Dumbbell_Lateral_Raise","Lateral Raise","4 x 15"],
      ["Rear_Delt_Fly","Rear Delt Fly","3 x 15"],
      ["Barbell_Curl","EZ Bar Curl","3 x 12"],
      ["Seated_Incline_Dumbbell_Curl","Incline Curl","3 x 12"],
      ["Rope_Pushdown","Rope Pushdown","3 x 12"],
      ["Skull_Crusher","Skull Crusher","3 x 10"]
    ]
  },

  "Thứ 7": {
    subtitle:"Cardio",
    recovery:"🚶 Đi bộ nhẹ / 🏊 Bơi — 60 phút"
  },

  "Chủ nhật": {
    subtitle:"Full Recovery",
    recovery:"😴 Ngủ đủ — 🍗 Ăn đủ protein — 🧘 Thả lỏng cơ"
  }

};

let mode = "fitnessprogramer";

const schedule = document.getElementById("schedule");

const simBtn = document.getElementById("simBtn");
const realBtn = document.getElementById("realBtn");

function renderSchedule(){

  schedule.innerHTML = "";

  Object.entries(exercises).forEach(([day,data])=>{

    const card = document.createElement("div");
    card.className = "day-card";

    let html = `
      <div class="day-header">
        <h2>${day}</h2>
        <p>${data.subtitle}</p>
      </div>
    `;

    if(data.items){

      html += `<div class="exercise-list">`;

      data.items.forEach(item=>{

        const [file,name,sets] = item;

        const badgeClass =
          mode === "real"
          ? "badge-real"
          : "badge-sim";

        const badgeText =
          mode === "real"
          ? "REAL"
          : "SIMULATOR";

        html += `
          <div class="exercise">

            <div class="gif-wrap">

              <div class="gif-badge ${badgeClass}">
                ${badgeText}
              </div>

              <img
                src="./exercise_gifs/${mode}/${file}.gif"
                alt="${name}"
                loading="lazy"
              >

            </div>

            <div class="exercise-content">
              <div class="exercise-name">
                ${name}
              </div>

              <div class="sets">
                ${sets}
              </div>
            </div>

          </div>
        `;
      });

      html += `</div>`;
    }

    if(data.recovery){
      html += `
        <div class="recovery">
          ${data.recovery}
        </div>
      `;
    }

    card.innerHTML = html;

    schedule.appendChild(card);

  });

}

renderSchedule();

simBtn.onclick = ()=>{

  mode = "fitnessprogramer";

  simBtn.classList.add("active");
  realBtn.classList.remove("active");

  renderSchedule();

};

realBtn.onclick = ()=>{

  mode = "real";

  realBtn.classList.add("active");
  simBtn.classList.remove("active");

  renderSchedule();

};

</script>

</body>
</html>
